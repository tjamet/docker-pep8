name: image

# Built by the in-cluster Gitea Actions runner. Build only: the image is never
# pushed.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: zot.jamet.me

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ZOT_USERNAME/ZOT_PASSWORD are the org-level secrets on tjamet. The login
      # precedes buildx and runs on pull requests too: zot has no anonymous
      # read, and both the BuildKit image and the Dockerfile base image are
      # pulled through it. (Secrets are not exposed to fork PRs.)
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=zot.jamet.me/docker-hub/moby/buildkit:buildx-stable-1

      # No cache-from/to: type=gha. The runner has the cache disabled, so the
      # backend cannot be resolved and an export would fail the build.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docker-pep8:ci

      - name: Smoke test
        run: docker run --rm docker-pep8:ci --version
